name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Actions are pinned to a full commit SHA, because a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The suite runs offline. Reproducing the measurements needs
      # Postgres and about two minutes of wall clock; asserting them does not.
      # The tests cover the comparators, the normalizer and the generator as
      # pure functions, plus the shipped results/*.json as evidence, so CI
      # stays fast and never depends on a container registry being up.
      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10"

      - run: python -m pytest -q

      # Every result figure in the README is re-derived from results/*.json and
      # must appear verbatim. A re-run that shifts a figure fails here instead of
      # leaving the document silently wrong.
      - name: README numbers match the shipped results
        run: python scripts/check_readme_numbers.py
